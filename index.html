<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>案件確認LIFF</title>
  <script src="https://d.line-scdn.net/liff/web/sdk/liff.js"></script>
  <style>
    :root {
      --main: #2563EB; --main-dark: #1D4ED8;
      --bg: #F8FAFC; --panel: #FFFFFF; --line: #E2E8F0;
      --text: #111827; --muted: #6B7280;
      --soft-blue: #EFF6FF; --soft-blue-border: #D6E4FF;
      --success: #16A34A; --warning: #F97316; --danger: #DC2626; --gray-btn: #E5E7EB;
      --zebra-a: #FFFFFF; --zebra-b: #EFF6FF;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
      --header-h: 54px; --footer-h: 66px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: var(--text); background: var(--bg); overflow: hidden; }
    body { width: 100vw; height: 100dvh; }
    button, input, select, textarea { font: inherit; }
    button { touch-action: manipulation; }
    .app { width: 100vw; height: 100dvh; display: flex; flex-direction: column; background: var(--bg); }

    .topbar { position: fixed; inset: 0 0 auto 0; height: var(--header-h); z-index: 30;
      display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 6px;
      padding: calc(6px + env(safe-area-inset-top)) 8px 6px 8px;
      background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
    .count-badge { white-space: nowrap; font-size: 11px; font-weight: 800; color: #fff;
      background: var(--warning); border-radius: 999px; padding: 6px 8px; line-height: 1; }
    .case-select { min-width: 0; height: 34px; border: 1px solid var(--line); border-radius: 8px;
      padding: 0 26px 0 8px; font-size: 12px; font-weight: 800; background: #fff; color: var(--text); }
    .nav-btn { height: 34px; border: 1px solid var(--line); background: #fff; color: var(--text);
      border-radius: 8px; padding: 0 9px; font-size: 12px; font-weight: 800; cursor: pointer; }

    .content { display: grid; grid-template-columns: minmax(130px, 40%) minmax(210px, 60%);
      width: 100%; height: 100dvh; padding-top: calc(var(--header-h) + env(safe-area-inset-top)); overflow: hidden; }
    .panel { min-width: 0; height: calc(100dvh - var(--header-h) - env(safe-area-inset-top));
      overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--panel); }
    .left-panel { border-right: 1px solid var(--line); padding: 8px 7px 18px; }
    .right-panel { position: relative; padding: 8px 8px calc(var(--footer-h) + 14px + env(safe-area-inset-bottom)); background: #fbfcff; }

    .section-title { position: sticky; top: 0; z-index: 5; margin: -8px -7px 8px; padding: 8px 8px 7px;
      background: rgba(255,255,255,0.96); border-bottom: 1px solid var(--line);
      font-size: 13px; font-weight: 900; letter-spacing: 0.02em; }
    .raw-text { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 11px;
      line-height: 1.58; letter-spacing: 0.01em; color: #111827; }

    .common-card, .accordion { background: #fff; border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 1px 4px rgba(15,23,42,0.04); overflow: hidden; margin-bottom: 8px; }
    .common-head { display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 7px 8px; background: #fff; border-bottom: 1px solid var(--line); }
    .common-head h2 { margin: 0; font-size: 13px; line-height: 1.25; }
    .status-chip { white-space: nowrap; font-size: 10px; color: var(--main); background: var(--soft-blue);
      border: 1px solid var(--soft-blue-border); border-radius: 999px; padding: 3px 6px; font-weight: 900; }

    .field-list { padding: 7px; display: grid; gap: 6px; }
    .field { display: grid; grid-template-columns: 1fr; gap: 3px; }
    .label-value { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px; min-width: 0; }
    .label { color: var(--muted); font-size: 10px; font-weight: 900; white-space: nowrap; }
    .copy-value { min-width: 0; width: 100%; display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid #E2E8F0; background: #F8FAFC; color: #111827; border-radius: 7px;
      padding: 4px 6px; font-size: 10.5px; line-height: 1.25; font-weight: 800; cursor: pointer; text-align: left; overflow: hidden; }
    .copy-value .copy-icon { flex: 0 0 auto; color: var(--main); font-size: 10px; }
    .copy-value .copy-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .edit-input, .edit-textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px;
      background: #fff; color: var(--text); outline: none; padding: 7px 8px; font-size: 13px; line-height: 1.2; }
    .edit-input { height: 34px; }
    .edit-textarea { min-height: 44px; resize: vertical; }
    .edit-input:focus, .edit-textarea:focus { border-color: var(--main); box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }

    .accordion-header { width: 100%; border: 0; background: #fff; padding: 9px; display: flex;
      align-items: center; justify-content: space-between; cursor: pointer; }
    .position-info { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .position-name { font-size: 15px; font-weight: 950; color: var(--main); letter-spacing: 0.04em; }
    .position-count { font-size: 10px; font-weight: 900; color: var(--muted); background: #F1F5F9; border-radius: 999px; padding: 3px 6px; }
    .chevron { width: 18px; height: 18px; display: grid; place-items: center; color: var(--main); font-size: 14px; transition: transform 0.18s ease; }
    .accordion.open .chevron { transform: rotate(180deg); }
    .accordion-body { display: none; border-top: 1px solid var(--line); padding: 0; }
    .accordion.open .accordion-body { display: block; }

    .date-block { padding: 8px 7px 9px; border-bottom: 1px solid var(--line); }
    .date-block:nth-child(odd) { background: var(--zebra-a); }
    .date-block:nth-child(even) { background: var(--zebra-b); }
    .date-block:last-child { border-bottom: 0; }
    .date-title { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 6px; }
    .date-title-main { min-width: 0; font-size: 14px; font-weight: 950; line-height: 1.28; color: #0f172a; }
    .block-discard-btn { flex: 0 0 auto; border: 1px solid #FCA5A5; background: #FEF2F2; color: #DC2626;
      border-radius: 7px; width: 30px; height: 28px; font-size: 13px; cursor: pointer; }
    .block-fields { display: grid; grid-template-columns: 1fr; gap: 6px; }

    .smart-date-row, .smart-time-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 34px; gap: 4px; align-items: center; min-width: 0; }
    .smart-date-display { min-width: 0; display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--soft-blue-border); background: var(--soft-blue); color: #0f172a;
      border-radius: 7px; padding: 5px 6px; font-size: 10.5px; line-height: 1.25; font-weight: 900; cursor: pointer; overflow: hidden; }
    .smart-date-display .date-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .smart-time-display { min-width: 0; display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid #BFDBFE; background: #FFFFFF; color: #0f172a; border-radius: 7px;
      padding: 5px 6px; font-size: 10.5px; line-height: 1.25; font-weight: 900; cursor: pointer; overflow: hidden; }
    .smart-time-display .time-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .calendar-open-btn, .time-open-btn { width: 34px; height: 30px; border-radius: 8px; display: grid;
      place-items: center; font-size: 15px; font-weight: 900; cursor: pointer; background: #fff; color: var(--main); }
    .calendar-open-btn { border: 1px solid var(--soft-blue-border); }
    .time-open-btn { border: 1px solid #BFDBFE; }

    .toast, .message { position: fixed; left: 50%; bottom: calc(var(--footer-h) + 14px + env(safe-area-inset-bottom));
      z-index: 80; transform: translateX(-50%) translateY(8px); min-width: 132px; max-width: 80vw;
      padding: 9px 13px; border-radius: 999px; background: rgba(17,24,39,0.94); color: #fff;
      font-size: 12px; font-weight: 900; text-align: center; opacity: 0; pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease; box-shadow: 0 8px 24px rgba(15,23,42,0.24); }
    .message.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .message.error { background: var(--danger); }

    .action-footer { position: fixed; right: 0; bottom: 0; left: 40%; height: calc(var(--footer-h) + env(safe-area-inset-bottom));
      z-index: 25; display: grid; grid-template-columns: 1fr 0.72fr; gap: 8px;
      padding: 9px 9px calc(9px + env(safe-area-inset-bottom)); background: rgba(255,255,255,0.96);
      border-top: 1px solid var(--line); box-shadow: 0 -3px 12px rgba(15,23,42,0.08); }
    .primary-btn, .secondary-btn { border: 0; border-radius: 10px; font-size: 13px; font-weight: 950; cursor: pointer; min-width: 0; }
    .primary-btn { background: var(--main); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,0.28); }
    .primary-btn:active { background: var(--main-dark); }
    .secondary-btn { background: var(--gray-btn); color: #374151; }

    .checkbox-row { display: flex; align-items: center; gap: 8px; background: #fff;
      border: 1px solid var(--line); border-radius: 10px; padding: 9px; margin-bottom: 8px; }
    .checkbox-row input { width: 18px; height: 18px; }
    .checkbox-row label { font-size: 12px; font-weight: 800; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 70; display: none; align-items: flex-end;
      justify-content: center; background: rgba(15,23,42,0.38); padding: 12px; }
    .modal-backdrop.show { display: flex; }
    .modal-box { width: min(100%, 430px); max-height: min(88dvh, 620px); display: flex; flex-direction: column;
      background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 52px rgba(15,23,42,0.28); }
    .modal-head { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
      padding: 12px 13px 9px; border-bottom: 1px solid var(--line); }
    .modal-title-main { font-size: 15px; font-weight: 950; line-height: 1.2; }
    .modal-title-sub { margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.3; font-weight: 700; }
    .close-btn { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 999px;
      background: #fff; color: #475569; font-size: 18px; line-height: 1; cursor: pointer; }
    .month-nav { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; gap: 6px;
      padding: 9px 12px; border-bottom: 1px solid var(--line); background: #F8FAFC; }
    .month-btn { width: 38px; height: 32px; border: 1px solid var(--line); border-radius: 9px;
      background: #fff; color: var(--main); font-weight: 950; cursor: pointer; }
    .month-label { text-align: center; font-size: 14px; font-weight: 950; }
    .calendar-area { overflow-y: auto; padding: 9px 12px 5px; }
    .week-grid, .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .week-cell { text-align: center; color: var(--muted); font-size: 10px; font-weight: 900; padding: 4px 0; }
    .day-cell { position: relative; min-height: 38px; border: 1px solid transparent; border-radius: 10px;
      background: #fff; color: var(--text); font-size: 13px; font-weight: 900; cursor: pointer; }
    .day-cell.empty { visibility: hidden; pointer-events: none; }
    .day-cell.sunday { color: var(--danger); }
    .day-cell.saturday { color: var(--main); }
    .day-cell.selected { background: var(--main); color: #fff; border-color: var(--main); box-shadow: 0 2px 8px rgba(37,99,235,0.22); }
    .calendar-foot { border-top: 1px solid var(--line); padding: 9px 12px calc(11px + env(safe-area-inset-bottom)); background: #fff; display: grid; gap: 8px; }
    .preview-box { min-height: 38px; background: var(--soft-blue); border: 1px solid var(--soft-blue-border);
      border-radius: 10px; padding: 8px 9px; font-size: 12px; line-height: 1.35; font-weight: 900; color: #0f172a; }
    .modal-actions { display: grid; grid-template-columns: 0.78fr 1fr; gap: 8px; }
    .time-picker-area { padding: 13px 12px 8px; background: #F8FAFC; }
    .time-picker-grid { display: grid; grid-template-columns: 1fr 1fr auto 1fr 1fr; gap: 6px; align-items: end; }
    .time-select-group { display: grid; gap: 4px; min-width: 0; }
    .time-select-group label { font-size: 10px; color: var(--muted); font-weight: 900; text-align: center; white-space: nowrap; }
    .time-select { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 10px;
      background: #fff; color: var(--text); font-size: 15px; font-weight: 950; text-align: center; padding: 0 6px; outline: none; }
    .time-wave { height: 40px; display: grid; place-items: center; color: var(--main); font-size: 17px; font-weight: 950; padding: 0 1px; }
    .ghost-btn { min-height: 40px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: #475569; font-size: 13px; font-weight: 950; cursor: pointer; }
    .confirm-btn { min-height: 40px; border: 0; border-radius: 10px; background: var(--main); color: #fff; font-size: 13px; font-weight: 950; cursor: pointer; }

    .loading { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,0.6); }
    .loading.show { display: flex; }
    .loading-box { background: #fff; padding: 16px 28px; border-radius: 12px; box-shadow: var(--shadow); font-weight: 900; }
    .empty-state { padding: 40px 16px; text-align: center; color: var(--muted); font-weight: 800; }

    @media (min-width: 700px) {
      :root { --header-h: 58px; --footer-h: 70px; }
      .topbar { grid-template-columns: auto minmax(260px, 1fr) auto auto; gap: 10px; padding-left: 14px; padding-right: 14px; }
      .left-panel { padding: 12px 12px 22px; }
      .right-panel { padding: 12px 14px calc(var(--footer-h) + 18px + env(safe-area-inset-bottom)); }
      .raw-text { font-size: 12.5px; }
      .field-list, .block-fields { grid-template-columns: 1fr 1fr; }
      .field.full { grid-column: 1 / -1; }
      .action-footer { padding-left: 14px; padding-right: 14px; }
      .modal-backdrop { align-items: center; }
    }
    @media (max-width: 360px) {
      .topbar { grid-template-columns: auto 1fr auto; }
      .topbar .nav-btn.prev { display: none; }
      .content { grid-template-columns: minmax(120px, 39%) minmax(188px, 61%); }
      .action-footer { left: 39%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="count-badge" id="countBadge">未処理 0件</div>
      <select class="case-select" id="caseSelect" aria-label="案件選択" onchange="handleCaseChange()"></select>
      <button class="nav-btn prev" type="button" onclick="prevCase()">前へ</button>
      <button class="nav-btn" type="button" onclick="nextCase()">次へ</button>
    </header>

    <main class="content">
      <section class="panel left-panel" aria-label="原文">
        <h1 class="section-title">原文</h1>
        <pre class="raw-text" id="rawText">読み込み中...</pre>
      </section>

      <section class="panel right-panel" aria-label="編集エリア">
        <section class="common-card">
          <div class="common-head">
            <h2>案件共通情報</h2>
            <span class="status-chip">入力なし＝元値維持</span>
          </div>
          <div class="field-list">
            <div class="field full">
              <div class="label-value">
                <span class="label">案件名:</span>
                <button class="copy-value" type="button" id="copyCaseName"><span class="copy-icon">⧉</span><span class="copy-text"></span></button>
              </div>
              <input class="edit-input" type="text" id="caseName" placeholder="修正・追加" autocomplete="off" />
            </div>
            <div class="field">
              <div class="label-value">
                <span class="label">クライアント:</span>
                <button class="copy-value" type="button" id="copyClient"><span class="copy-icon">⧉</span><span class="copy-text"></span></button>
              </div>
              <input class="edit-input" type="text" id="client" placeholder="修正・追加" autocomplete="off" />
            </div>
            <div class="field">
              <div class="label-value">
                <span class="label">担当者:</span>
                <button class="copy-value" type="button" id="copyContact"><span class="copy-icon">⧉</span><span class="copy-text"></span></button>
              </div>
              <input class="edit-input" type="text" id="contact" placeholder="修正・追加" autocomplete="off" />
            </div>
          </div>
        </section>

        <div id="positionAccordions"></div>

        <div class="checkbox-row">
          <input type="checkbox" id="registerToCase" checked>
          <label for="registerToCase">この案件を案件情報に登録する</label>
        </div>

        <button type="button" id="discardBtn" onclick="discardCase()" style="width:100%;border:1px solid #FCA5A5;background:#FEF2F2;color:#DC2626;border-radius:10px;padding:10px;font-size:12px;font-weight:900;cursor:pointer;margin-bottom:8px;">🗑 この案件を破棄（重複時など）</button>
      </section>
    </main>

    <footer class="action-footer">
      <button class="primary-btn" type="button" onclick="saveData()">保存して確認済に</button>
      <button class="secondary-btn" type="button" onclick="nextCase()">次へ</button>
    </footer>

    <div id="message" class="message" role="status"></div>
    <div id="loading" class="loading"><div class="loading-box">処理中...</div></div>

    <!-- カレンダーモーダル -->
    <div id="calendarBackdrop" class="modal-backdrop">
      <section class="modal-box" role="dialog" aria-modal="true">
        <header class="modal-head">
          <div>
            <div class="modal-title-main">日付を修正</div>
            <div class="modal-title-sub">タップで選択/解除。連日・飛び石は自動判定</div>
          </div>
          <button id="calendarClose" class="close-btn" type="button">×</button>
        </header>
        <div class="month-nav">
          <button id="prevMonth" class="month-btn" type="button">‹</button>
          <div id="monthLabel" class="month-label"></div>
          <button id="nextMonth" class="month-btn" type="button">›</button>
        </div>
        <div class="calendar-area">
          <div class="week-grid">
            <div class="week-cell">日</div><div class="week-cell">月</div><div class="week-cell">火</div>
            <div class="week-cell">水</div><div class="week-cell">木</div><div class="week-cell">金</div><div class="week-cell">土</div>
          </div>
          <div id="dayGrid" class="day-grid"></div>
        </div>
        <footer class="calendar-foot">
          <div id="datePreview" class="preview-box">選択中：未選択</div>
          <div class="modal-actions">
            <button id="clearDates" class="ghost-btn" type="button">全解除</button>
            <button id="confirmDates" class="confirm-btn" type="button">確定</button>
          </div>
        </footer>
      </section>
    </div>

    <!-- 稼働時間モーダル -->
    <div id="timeBackdrop" class="modal-backdrop">
      <section class="modal-box" role="dialog" aria-modal="true">
        <header class="modal-head">
          <div>
            <div class="modal-title-main">稼働時間を修正</div>
            <div class="modal-title-sub">分は00/15/30/45のみ</div>
          </div>
          <button id="timeClose" class="close-btn" type="button">×</button>
        </header>
        <div class="time-picker-area">
          <div class="time-picker-grid">
            <div class="time-select-group"><label>開始(時)</label><select id="startHour" class="time-select"></select></div>
            <div class="time-select-group"><label>開始(分)</label><select id="startMinute" class="time-select"></select></div>
            <div class="time-wave">〜</div>
            <div class="time-select-group"><label>終了(時)</label><select id="endHour" class="time-select"></select></div>
            <div class="time-select-group"><label>終了(分)</label><select id="endMinute" class="time-select"></select></div>
          </div>
        </div>
        <footer class="calendar-foot">
          <div id="timePreview" class="preview-box">選択中：未選択</div>
          <div class="modal-actions">
            <button id="cancelTime" class="ghost-btn" type="button">キャンセル</button>
            <button id="confirmTime" class="confirm-btn" type="button">確定</button>
          </div>
        </footer>
      </section>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwrpujZnwOw98ieBUmX_D_sOYfS9QjgII_jHW2dGt3tZ9poo3rl9PHpp7Tn3baAYn6D/exec';
    const LIFF_ID = '2010162762-VhyEkMPy';
    const dayNames = ["日","月","火","水","木","金","土"];

    let casesData = [];
    let currentIndex = 0;

    // ===== 日付ユーティリティ =====
    function toDate(key){ if(!key) return null; const s=String(key).slice(0,10); const [y,m,d]=s.split('-').map(Number); if(!y||!m||!d) return null; return new Date(y,m-1,d); }
    function toKey(date){ const y=date.getFullYear(); const m=String(date.getMonth()+1).padStart(2,'0'); const d=String(date.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; }
    function parseDateArray(value){ if(!value) return []; return String(value).split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const dt=toDate(s); return dt?toKey(dt):null;}).filter(Boolean); }
    function formatDateJp(key){ const date=toDate(key); if(!date) return key; const yy=String(date.getFullYear()).slice(-2); const mm=String(date.getMonth()+1).padStart(2,'0'); const dd=String(date.getDate()).padStart(2,'0'); return `${yy}/${mm}/${dd}（${dayNames[date.getDay()]}）`; }
    function uniqueSorted(keys){ return [...new Set(keys)].sort((a,b)=>toDate(a)-toDate(b)); }
    function isConsecutive(keys){ if(keys.length<=1) return false; const s=uniqueSorted(keys); for(let i=1;i<s.length;i++){ if(Math.round((toDate(s[i])-toDate(s[i-1]))/86400000)!==1) return false; } return true; }
    function displayDateArray(keys){ const s=uniqueSorted(keys); if(s.length===0) return '未設定'; if(s.length===1) return formatDateJp(s[0]); if(isConsecutive(s)) return `${formatDateJp(s[0])}〜${formatDateJp(s[s.length-1])} 連続${s.length}日`; return `${s.map(formatDateJp).join(', ')} 飛び石${s.length}日`; }

    // ===== 時間ユーティリティ =====
    function parseTimeRange(value){ const m=/(\d{1,2}):(\d{2})\s*[~〜]\s*(\d{1,2}):(\d{2})/.exec(value||''); if(!m) return {sh:'09',sm:'00',eh:'18',em:'00'}; return {sh:m[1].padStart(2,'0'),sm:m[2],eh:m[3].padStart(2,'0'),em:m[4]}; }
    function formatTimeStorage(p){ return `${p.sh}:${p.sm}~${p.eh}:${p.em}`; }
    function formatTimeDisplay(value){ if(!value) return '未設定'; const p=parseTimeRange(value); return `${p.sh}:${p.sm} 〜 ${p.eh}:${p.em}`; }

    // ===== 数値・文字 =====
    function withComma(n){ const num=parseInt(String(n).replace(/[^0-9-]/g,''),10); if(isNaN(num)) return '0'; return num.toLocaleString('ja-JP'); }
    function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // ===== コピー・トースト =====
    let toastTimer=null;
    function showMessage(text,isError){ const el=document.getElementById('message'); el.textContent=text; el.classList.toggle('error',!!isError); el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1500); }
    async function copyText(text){ try{ if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(text);}else{ const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.left='-9999px'; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t);} showMessage('コピーしました',false);}catch(e){ showMessage('コピーできませんでした',true);} }
    function showLoading(show){ document.getElementById('loading').classList.toggle('show',show); }

    // ===== LIFF初期化＆データ取得 =====
    async function initLiff(){ try{ await liff.init({liffId:LIFF_ID}); if(!liff.isLoggedIn()){ liff.login(); return; } }catch(e){ console.error('LIFF init error:',e); } loadCasesData(); }

    async function loadCasesData(){
      try{
        showLoading(true);
        const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',body:JSON.stringify({action:'getUnconfirmedCases'})});
        const data=await res.json();
        casesData=data.cases||[];
        currentIndex=0;
        showLoading(false);
        if(casesData.length===0){ renderEmpty(); return; }
        populateCaseSelect();
        displayCase(0);
      }catch(e){ console.error('Load error:',e); showLoading(false); showMessage('読み込みエラー: '+e.message,true); }
    }

    function renderEmpty(){
      document.getElementById('countBadge').textContent='未処理 0件';
      document.getElementById('caseSelect').innerHTML='<option>案件なし</option>';
      document.getElementById('positionAccordions').innerHTML='<div class="empty-state">未確認の案件はありません</div>';
      document.getElementById('rawText').textContent='';
    }

    function populateCaseSelect(){
      const sel=document.getElementById('caseSelect');
      sel.innerHTML='';
      casesData.forEach((item,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`${i+1}. ${item.caseName}`; sel.appendChild(o); });
      sel.value=currentIndex;
      document.getElementById('countBadge').textContent=`未処理 ${casesData.length}件`;
    }

    function displayCase(index){
      if(index<0||index>=casesData.length) return;
      currentIndex=index;
      const c=casesData[index];
      document.getElementById('caseSelect').value=index;
      document.getElementById('rawText').textContent=c.rawText||'原文なし';

      setCopy('copyCaseName', c.caseName||'');
      setCopy('copyClient', c.client||'');
      setCopy('copyContact', c.contact||'');
      document.getElementById('caseName').value='';
      document.getElementById('client').value='';
      document.getElementById('contact').value='';

      renderPositions(c.positions||{});
      document.getElementById('registerToCase').checked=true;
    }

    function setCopy(btnId, value){
      const btn=document.getElementById(btnId);
      btn.querySelector('.copy-text').textContent=value;
      btn.onclick=()=>copyText(value);
    }

    function handleCaseChange(){ displayCase(parseInt(document.getElementById('caseSelect').value)); }
    function prevCase(){ if(currentIndex>0) displayCase(currentIndex-1); }
    function nextCase(){ if(currentIndex<casesData.length-1) displayCase(currentIndex+1); }

    // ===== ポジション動的描画 =====
    function renderPositions(positions){
      const container=document.getElementById('positionAccordions');
      container.innerHTML='';
      const order=['D','AD','ST'];
      const keys=Object.keys(positions).filter(k=>(positions[k]||[]).length>0);
      keys.sort((a,b)=>{ const ia=order.indexOf(a),ib=order.indexOf(b); return (ia===-1?99:ia)-(ib===-1?99:ib); });

      keys.forEach(posType=>{
        const arr=positions[posType];
        const acc=document.createElement('section');
        acc.className='accordion open';
        acc.dataset.position=posType;

        let blocksHtml='';
        arr.forEach((p,idx)=>{
          const uid=`${posType}__${idx}`;
          const dateArr=parseDateArray(p.date);
          const dateDisp=displayDateArray(dateArr);
          const wt=p.workTime||'';
          const wtDisp=formatTimeDisplay(wt);
          blocksHtml+=`
            <article class="date-block" data-pos="${posType}" data-idx="${idx}" data-rowindex="${p.rowIndex}">
              <div class="date-title">
                <div class="date-title-main" data-block-title="${uid}">${escapeHtml(dateDisp)}</div>
                <button type="button" class="block-discard-btn" data-discard-row="${p.rowIndex}" title="このセクションを破棄">🗑</button>
              </div>
              <div class="block-fields">
                <div class="field full">
                  <div class="smart-date-row">
                    <span class="label">日付:</span>
                    <button class="smart-date-display" type="button" data-date-display="${uid}" data-copy="${escapeHtml(dateDisp)}"><span class="copy-icon">⧉</span><span class="date-text">${escapeHtml(dateDisp)}</span></button>
                    <button class="calendar-open-btn" type="button" data-date-edit="${uid}">📅</button>
                  </div>
                  <input type="hidden" class="field-date" value="${escapeHtml(dateArr.join(','))}">
                </div>
                <div class="field">
                  <div class="smart-time-row">
                    <span class="label">稼働時間:</span>
                    <button class="smart-time-display" type="button" data-time-display="${uid}" data-copy="${escapeHtml(wtDisp)}"><span class="copy-icon">⧉</span><span class="time-text">${escapeHtml(wtDisp)}</span></button>
                    <button class="time-open-btn" type="button" data-time-edit="${uid}">🕐</button>
                  </div>
                  <input type="hidden" class="field-worktime" value="${escapeHtml(wt)}">
                </div>
                <div class="field">
                  <div class="label-value"><span class="label">入り単価:</span>
                    <button class="copy-value" type="button" data-copy="${withComma(p.unitPrice)}"><span class="copy-icon">⧉</span><span class="copy-text">${withComma(p.unitPrice)}</span></button></div>
                  <input class="edit-input field-price" type="text" inputmode="numeric" placeholder="修正・追加">
                </div>
                <div class="field">
                  <div class="label-value"><span class="label">交通費:</span>
                    <button class="copy-value" type="button" data-copy="${withComma(p.transport)}"><span class="copy-icon">⧉</span><span class="copy-text">${withComma(p.transport)}</span></button></div>
                  <input class="edit-input field-transport" type="text" inputmode="numeric" placeholder="修正・追加">
                </div>
                <div class="field">
                  <div class="label-value"><span class="label">食費:</span>
                    <button class="copy-value" type="button" data-copy="${withComma(p.meal)}"><span class="copy-icon">⧉</span><span class="copy-text">${withComma(p.meal)}</span></button></div>
                  <input class="edit-input field-meal" type="text" inputmode="numeric" placeholder="修正・追加">
                </div>
                <div class="field full">
                  <div class="label-value"><span class="label">特記:</span>
                    <button class="copy-value" type="button" data-copy="${escapeHtml(p.remark||'')}"><span class="copy-icon">⧉</span><span class="copy-text">${escapeHtml(p.remark||'')}</span></button></div>
                  <textarea class="edit-textarea field-remark" placeholder="修正・追加"></textarea>
                </div>
              </div>
            </article>`;
        });

        acc.innerHTML=`
          <button class="accordion-header" type="button">
            <span class="position-info"><span class="position-name">${escapeHtml(posType)}</span><span class="position-count">${arr.length}条件</span></span>
            <span class="chevron">⌄</span>
          </button>
          <div class="accordion-body">${blocksHtml}</div>`;
        container.appendChild(acc);
      });

      bindEvents();
    }

    function bindEvents(){
      document.querySelectorAll('.accordion-header').forEach(h=>{ h.onclick=()=>h.closest('.accordion').classList.toggle('open'); });
      document.querySelectorAll('#positionAccordions .copy-value').forEach(el=>{ el.onclick=(e)=>{ e.stopPropagation(); copyText(el.dataset.copy||el.innerText.trim()); }; });
      document.querySelectorAll('.smart-date-display').forEach(el=>{ el.onclick=(e)=>{ e.stopPropagation(); copyText(el.dataset.copy||el.innerText.trim()); }; });
      document.querySelectorAll('.smart-time-display').forEach(el=>{ el.onclick=(e)=>{ e.stopPropagation(); copyText(el.dataset.copy||el.innerText.trim()); }; });
      document.querySelectorAll('[data-date-edit]').forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation(); openCalendar(b.dataset.dateEdit); }; });
      document.querySelectorAll('[data-time-edit]').forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation(); openTimeModal(b.dataset.timeEdit); }; });
      document.querySelectorAll('[data-discard-row]').forEach(b=>{ b.onclick=(e)=>{ e.stopPropagation(); discardRow(b.dataset.discardRow); }; });
    }

    function getBlockByUid(uid){ const [pos,idx]=uid.split('__'); return document.querySelector(`.date-block[data-pos="${pos}"][data-idx="${idx}"]`); }

    // ===== カレンダー =====
    let calActiveUid=null, calSelected=new Set(), calYear=2025, calMonth=5;
    function openCalendar(uid){ calActiveUid=uid; const block=getBlockByUid(uid); calSelected=new Set(parseDateArray(block.querySelector('.field-date').value)); const first=uniqueSorted([...calSelected])[0]||toKey(new Date()); const d=toDate(first); calYear=d.getFullYear(); calMonth=d.getMonth(); renderCalendar(); updateCalPreview(); document.getElementById('calendarBackdrop').classList.add('show'); }
    function closeCalendar(){ document.getElementById('calendarBackdrop').classList.remove('show'); calActiveUid=null; calSelected=new Set(); }
    function renderCalendar(){ document.getElementById('monthLabel').textContent=`${calYear}年${calMonth+1}月`; const first=new Date(calYear,calMonth,1); const last=new Date(calYear,calMonth+1,0); const grid=document.getElementById('dayGrid'); grid.innerHTML=''; for(let i=0;i<first.getDay();i++){ const e=document.createElement('div'); e.className='day-cell empty'; grid.appendChild(e);} for(let day=1;day<=last.getDate();day++){ const date=new Date(calYear,calMonth,day); const key=toKey(date); const btn=document.createElement('button'); btn.type='button'; btn.className='day-cell'; btn.textContent=day; if(date.getDay()===0) btn.classList.add('sunday'); if(date.getDay()===6) btn.classList.add('saturday'); if(calSelected.has(key)) btn.classList.add('selected'); btn.onclick=()=>{ if(calSelected.has(key)) calSelected.delete(key); else calSelected.add(key); renderCalendar(); updateCalPreview(); }; grid.appendChild(btn);} }
    function updateCalPreview(){ document.getElementById('datePreview').textContent='選択中：'+displayDateArray([...calSelected]); }

    // ===== 時間 =====
    let timeActiveUid=null;
    function openTimeModal(uid){ timeActiveUid=uid; const block=getBlockByUid(uid); const p=parseTimeRange(block.querySelector('.field-worktime').value); document.getElementById('startHour').value=p.sh; document.getElementById('startMinute').value=p.sm; document.getElementById('endHour').value=p.eh; document.getElementById('endMinute').value=p.em; updateTimePreview(); document.getElementById('timeBackdrop').classList.add('show'); }
    function closeTimeModal(){ document.getElementById('timeBackdrop').classList.remove('show'); timeActiveUid=null; }
    function getTimeParts(){ return {sh:document.getElementById('startHour').value,sm:document.getElementById('startMinute').value,eh:document.getElementById('endHour').value,em:document.getElementById('endMinute').value}; }
    function updateTimePreview(){ document.getElementById('timePreview').textContent='選択中：'+formatTimeDisplay(formatTimeStorage(getTimeParts())); }
    function fillTimeOptions(){ const hours=Array.from({length:24},(_,i)=>String(i).padStart(2,'0')); const mins=['00','15','30','45']; ['startHour','endHour'].forEach(id=>document.getElementById(id).innerHTML=hours.map(v=>`<option value="${v}">${v}</option>`).join('')); ['startMinute','endMinute'].forEach(id=>document.getElementById(id).innerHTML=mins.map(v=>`<option value="${v}">${v}</option>`).join('')); }

    // ===== 保存 =====
    async function saveData(){
      try{
        if(casesData.length===0){ showMessage('保存対象がありません',true); return; }
        showLoading(true);
        const c=casesData[currentIndex];
        const cn=document.getElementById('caseName').value.trim();
        const cl=document.getElementById('client').value.trim();
        const ct=document.getElementById('contact').value.trim();
        const updated={ extId:c.extId, caseName:cn||c.caseName||'', client:cl||c.client||'', contact:ct||c.contact||'', registerToCase:document.getElementById('registerToCase').checked, positions:{} };
        const numClean=(s)=>parseInt(String(s).replace(/[^0-9-]/g,''),10)||0;

        document.querySelectorAll('#positionAccordions .date-block').forEach(block=>{
          const pos=block.dataset.pos;
          if(!updated.positions[pos]) updated.positions[pos]=[];
          const cv=block.querySelectorAll('.copy-value');
          const priceIn=block.querySelector('.field-price').value.trim();
          const transIn=block.querySelector('.field-transport').value.trim();
          const mealIn=block.querySelector('.field-meal').value.trim();
          const remarkIn=block.querySelector('.field-remark').value.trim();
          updated.positions[pos].push({
            date: block.querySelector('.field-date').value||'',
            workTime: block.querySelector('.field-worktime').value||'',
            unitPrice: priceIn!==''?numClean(priceIn):numClean(cv[0]?.dataset.copy),
            transport: transIn!==''?numClean(transIn):numClean(cv[1]?.dataset.copy),
            meal: mealIn!==''?numClean(mealIn):numClean(cv[2]?.dataset.copy),
            remark: remarkIn!==''?remarkIn:(cv[3]?.dataset.copy||'')
          });
        });

        const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',body:JSON.stringify({action:'saveCaseConfirmation',data:updated})});
        const result=await res.json();
        showLoading(false);
        if(result.success){ showMessage('✅ 保存完了！',false); setTimeout(()=>loadCasesData(),800); }
        else{ showMessage('❌ 保存失敗: '+(result.error||'不明'),true); }
      }catch(e){ console.error('Save error:',e); showLoading(false); showMessage('保存エラー: '+e.message,true); }
    }

    // ===== セクション（日付ブロック）単位の破棄 =====
    async function discardRow(rowIndex){
      if(!confirm('このセクションを破棄します。\nよろしいですか？\n（データは残り、次回から表示されません）')) return;
      try{
        showLoading(true);
        const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',body:JSON.stringify({action:'discardRow',rowIndex:Number(rowIndex)})});
        const result=await res.json();
        showLoading(false);
        if(result.success){ showMessage('🗑 破棄しました',false); setTimeout(()=>loadCasesData(),700); }
        else{ showMessage('破棄失敗: '+(result.error||'不明'),true); }
      }catch(e){ showLoading(false); showMessage('破棄エラー: '+e.message,true); }
    }

    // ===== 案件の破棄 =====
    async function discardCase(){
      if(casesData.length===0){ showMessage('対象がありません',true); return; }
      const c=casesData[currentIndex];
      if(!confirm(`「${c.caseName}」を破棄します。\nよろしいですか？\n（データは残り、未確認リストから外れます）`)) return;
      try{
        showLoading(true);
        const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow',body:JSON.stringify({action:'discardCase',extId:c.extId})});
        const result=await res.json();
        showLoading(false);
        if(result.success){ showMessage('🗑 破棄しました',false); setTimeout(()=>loadCasesData(),800); }
        else{ showMessage('破棄失敗: '+(result.error||'不明'),true); }
      }catch(e){ showLoading(false); showMessage('破棄エラー: '+e.message,true); }
    }

    // ===== モーダルのボタン登録 =====
    function setupModals(){
      fillTimeOptions();
      document.getElementById('prevMonth').onclick=()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); };
      document.getElementById('nextMonth').onclick=()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); };
      document.getElementById('clearDates').onclick=()=>{ calSelected.clear(); renderCalendar(); updateCalPreview(); };
      document.getElementById('calendarClose').onclick=closeCalendar;
      document.getElementById('calendarBackdrop').onclick=(e)=>{ if(e.target===document.getElementById('calendarBackdrop')) closeCalendar(); };
      document.getElementById('confirmDates').onclick=()=>{ if(!calActiveUid) return; const arr=uniqueSorted([...calSelected]); const block=getBlockByUid(calActiveUid); block.querySelector('.field-date').value=arr.join(','); const disp=displayDateArray(arr); const d=block.querySelector('.smart-date-display'); d.querySelector('.date-text').textContent=disp; d.dataset.copy=disp; block.querySelector('[data-block-title]').textContent=disp; closeCalendar(); showMessage('日付を反映しました',false); };

      ['startHour','startMinute','endHour','endMinute'].forEach(id=>document.getElementById(id).addEventListener('change',updateTimePreview));
      document.getElementById('timeClose').onclick=closeTimeModal;
      document.getElementById('cancelTime').onclick=closeTimeModal;
      document.getElementById('timeBackdrop').onclick=(e)=>{ if(e.target===document.getElementById('timeBackdrop')) closeTimeModal(); };
      document.getElementById('confirmTime').onclick=()=>{ if(!timeActiveUid) return; const val=formatTimeStorage(getTimeParts()); const block=getBlockByUid(timeActiveUid); block.querySelector('.field-worktime').value=val; const disp=formatTimeDisplay(val); const t=block.querySelector('.smart-time-display'); t.querySelector('.time-text').textContent=disp; t.dataset.copy=disp; closeTimeModal(); showMessage('稼働時間を反映しました',false); };

      document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ closeCalendar(); closeTimeModal(); } });
    }

    window.onload=()=>{ setupModals(); initLiff(); };
  </script>
</body>
</html>
